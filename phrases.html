<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>常用语 - 荣耀语学习</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .phrase-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      padding: 20px 0 40px;
    }

    .phrase-card {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
      transition: all 0.3s ease;
    }

    .phrase-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.15);
    }

    .phrase-chinese {
      font-size: 18px;
      color: #1e40af;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .phrase-letters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .phrase-letters img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    @media (max-width: 480px) {
      .phrase-list {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .phrase-card {
        padding: 15px;
      }

      .phrase-chinese {
        font-size: 16px;
        margin-bottom: 10px;
      }

      .phrase-letters img {
        width: 32px;
        height: 32px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="container">
      <div class="nav-wrapper">
        <a href="index.html" class="logo">荣耀语学习网站</a>
        <nav class="nav-tabs">
          <a href="letters.html" class="nav-tab">字母</a>
          <a href="syntax.html" class="nav-tab">语法</a>
          <a href="words.html" class="nav-tab">单词</a>
          <a href="phrases.html" class="nav-tab active">常用语</a>
          <a href="quiz.html" class="nav-tab">测试</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">荣耀语常用语</h1>

    <div class="phrase-list" id="phraseList"></div>
  </main>

  <footer>
    <div class="container">
      <p>荣耀语学习系统 - Written by <a href="https://taoi.me" target="_blank" style="color: #2563eb; text-decoration: none;">小夏不菜吖</a></p>
    </div>
  </footer>

  <script>
    const phrases = [
      { chinese: "我吃饭", letters: ["2", "1", "3", "3", "5"] },
      { chinese: "谁?", letters: ["20", "14"] },
      { chinese: "早上好", letters: ["15", "15", "20"] },
      { chinese: "中午好", letters: ["15", "19", "20"] },
      { chinese: "晚上好", letters: ["19", "19", "20"] },
      { chinese: "不许od", letters: ["5", "13", "18", "21"] },
      { chinese: "别抽烟", letters: ["5", "13", "5", "3", "22"] },
    ];

    document.getElementById('phraseList').innerHTML = phrases.map(p => `
      <div class="phrase-card">
        <div class="phrase-chinese">${p.chinese}</div>
        <div class="phrase-letters">
          ${p.letters.map(n => `<img src="img/${n}.png" alt="字母">`).join('')}
        </div>
      </div>
    `).join('');

    function showMessage(el) {
      el.style.opacity = '0.6';
      setTimeout(() => {
        alert('该模块正在开发中，敬请期待！');
        el.style.opacity = '1';
      }, 100);
    }
  </script>
</body>

</html>
