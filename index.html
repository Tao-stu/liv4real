        .home-info-item {

        .home-links a {
            color: #2563eb;

        .home-start {

            margin-top: 30px;
            padding: 15px 40px;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
            font-size: 18px;
            transition: all 0.3s;
        }

        .home-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3);
        }

        @media (max-width: 480px) {
            .home-card {
                padding: 30px 20px;
            }

            .home-title {
                font-size: 24px;
            }

            .home-info-item {
